<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Référentiel Naturo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Naturo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151A17" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">
<style>
[hidden]{display:none!important}
/* Layout : barre de recherche fixe en haut, colonne de navigation à gauche, lecture au centre, sommaire à droite sur grand écran */
:root{
  --bg:#F4F5F1; --surface:#FFFFFF; --surface-2:#F9FAF7; --ink:#25302A; --muted:#67736B; --faint:#98A29A;
  --line:#DEE3DB; --accent:#2F6B4E; --accent-ink:#FFFFFF; --accent-soft:#E2EFE6; --focus:#5B9A7A;
  --mark:#FFE58A; --mark-ink:#25302A;
  --k-alert-bg:#FCEBF1; --k-alert-line:#E5A9BE; --k-alert-ink:#8E3555;
  --k-upd-bg:#FFF6D8; --k-upd-line:#E7CB72; --k-upd-ink:#7A5B0D;
  --k-med-bg:#EDF3FA; --k-med-line:#B6CDE6; --k-med-ink:#30577F;
  --k-nat-bg:#EBF5EE; --k-nat-line:#AFD3BC; --k-nat-ink:#2F6B4E;
  --k-emo-bg:#F3EFFA; --k-emo-line:#CEC2E8; --k-emo-ink:#5D4B8C;
  --k-warn-bg:#FDF1E6; --k-warn-line:#EDC39C; --k-warn-ink:#8A5426;
  --k-perso-bg:#E9F5F4; --k-perso-line:#A8D4D0; --k-perso-ink:#2C6964;
  --k-note-bg:#F3F4F0; --k-note-line:#DADFD6;
  --shadow:0 1px 2px rgba(37,48,42,.06),0 6px 22px rgba(37,48,42,.07);
  --font:"Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161B18; --surface:#1E2521; --surface-2:#232B26; --ink:#E6ECE7; --muted:#A3AEA6; --faint:#77827A;
  --line:#323C36; --accent:#7CC39E; --accent-ink:#11251B; --accent-soft:#25382D; --focus:#7CC39E;
  --mark:#7A6420; --mark-ink:#FFF6D8;
  --k-alert-bg:#3A2029; --k-alert-line:#7D3B54; --k-alert-ink:#F2B4C9;
  --k-upd-bg:#372F17; --k-upd-line:#7C6524; --k-upd-ink:#F0D98C;
  --k-med-bg:#1E2B39; --k-med-line:#3C5878; --k-med-ink:#A9C8EA;
  --k-nat-bg:#1C2E24; --k-nat-line:#3A6A4F; --k-nat-ink:#9FD5B6;
  --k-emo-bg:#29243A; --k-emo-line:#54487A; --k-emo-ink:#CFC3F0;
  --k-warn-bg:#36261A; --k-warn-line:#7A5130; --k-warn-ink:#F0C49B;
  --k-perso-bg:#1B302E; --k-perso-line:#3D6E6A; --k-perso-ink:#A3DAD5;
  --k-note-bg:#232B26; --k-note-line:#36413A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161B18; --surface:#1E2521; --surface-2:#232B26; --ink:#E6ECE7; --muted:#A3AEA6; --faint:#77827A;
  --line:#323C36; --accent:#7CC39E; --accent-ink:#11251B; --accent-soft:#25382D; --focus:#7CC39E;
  --mark:#7A6420; --mark-ink:#FFF6D8;
  --k-alert-bg:#3A2029; --k-alert-line:#7D3B54; --k-alert-ink:#F2B4C9;
  --k-upd-bg:#372F17; --k-upd-line:#7C6524; --k-upd-ink:#F0D98C;
  --k-med-bg:#1E2B39; --k-med-line:#3C5878; --k-med-ink:#A9C8EA;
  --k-nat-bg:#1C2E24; --k-nat-line:#3A6A4F; --k-nat-ink:#9FD5B6;
  --k-emo-bg:#29243A; --k-emo-line:#54487A; --k-emo-ink:#CFC3F0;
  --k-warn-bg:#36261A; --k-warn-line:#7A5130; --k-warn-ink:#F0C49B;
  --k-perso-bg:#1B302E; --k-perso-line:#3D6E6A; --k-perso-ink:#A3DAD5;
  --k-note-bg:#232B26; --k-note-line:#36413A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 1px}

/* chips de couleur par groupe : chaque élément reçoit --cb-l/--cf-l/--cb-d/--cf-d */
.tint{--cb:var(--cb-l);--cf:var(--cf-l)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tint{--cb:var(--cb-d);--cf:var(--cf-d)}}
:root[data-theme="dark"] .tint{--cb:var(--cb-d);--cf:var(--cf-d)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
.back{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 13px 7px 9px;font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;flex:none}
.back[hidden]{display:none}
.back svg{width:18px;height:18px}
@media (max-width:700px){.back span{display:none}.back{padding:8px}}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.01em;white-space:nowrap;cursor:pointer;background:none;border:0;padding:4px 2px}
.brand svg{width:26px;height:26px;flex:none}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.brand span{line-height:1.15;text-align:left}
.search{flex:1;min-width:0;position:relative;max-width:760px}
.search input{width:100%;height:46px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 46px 0 46px;font-size:15.5px;transition:border-color .15s,box-shadow .15s}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:var(--surface)}
.search svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:500 11px var(--font);color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 6px;background:var(--surface)}
.search .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:var(--line);width:26px;height:26px;border-radius:50%;cursor:pointer;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07);color:var(--accent-ink)}
a.btn{text-decoration:none}
.fhead .tools a.btn.primary,.cons a.btn,.cons .btn.primary{text-decoration:none}
.fhead .tools a.cbtn{background:var(--accent)!important;color:var(--accent-ink)!important;border-color:var(--accent)!important;font-weight:600}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--k-alert-ink);border-color:var(--k-alert-line)}
.btn svg{width:15px;height:15px}

.shell{display:grid;grid-template-columns:262px minmax(0,1fr);max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:28px}
nav.side{position:sticky;top:calc(71px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 71px - env(safe-area-inset-top,0px));overflow:auto;padding-block:22px 40px;scrollbar-width:thin}
.side h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:18px 10px 6px}
.side button.it{display:flex;width:100%;align-items:center;gap:9px;border:0;background:none;text-align:left;padding:6px 10px;border-radius:9px;font-size:13.8px;cursor:pointer;color:var(--ink)}
.side button.it:hover{background:var(--surface)}
.side button.it[aria-current="true"]{background:var(--surface);box-shadow:var(--shadow);font-weight:500}
.side .dot{width:9px;height:9px;border-radius:50%;background:var(--cf);flex:none}
.side .n{margin-left:auto;color:var(--faint);font-size:12px;font-variant-numeric:tabular-nums}
main{min-width:0;padding-block:26px 80px}

.hero{padding:30px 32px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow);display:grid;gap:16px}
.hero h1{margin:0;font-size:clamp(22px,3vw,30px);font-weight:600;line-height:1.2;text-wrap:balance}
.hero p{margin:0;color:var(--muted);max-width:62ch}
.try{display:flex;flex-wrap:wrap;gap:8px}
.try button{border:1px dashed var(--line);background:var(--surface-2);border-radius:999px;padding:5px 13px;font-size:13px;cursor:pointer;color:var(--ink)}
.try button:hover{border-style:solid;border-color:var(--accent);color:var(--accent)}
.grid-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:22px}
.cat{border:0;text-align:left;cursor:pointer;background:var(--cb);color:var(--cf);border-radius:16px;padding:16px 18px;display:grid;gap:2px;min-height:96px;transition:transform .12s}
.cat:hover{transform:translateY(-2px)}
.cat b{font-weight:600;font-size:15px;line-height:1.3}
.cat span{font-size:12.5px;opacity:.85}
h2.blk{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:34px 0 10px}

.chip{display:inline-flex;align-items:center;gap:6px;background:var(--cb);color:var(--cf);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;border:0;cursor:pointer}
.chip.plain{cursor:default}
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:6px 14px;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 16px;cursor:pointer;color:var(--ink)}
.row:hover{border-color:var(--accent)}
.row .t{font-weight:500;min-width:0}
.row .s{grid-column:1/-1;color:var(--muted);font-size:13px;min-width:0}
.row .snip{grid-column:1/-1;font-size:13.5px;color:var(--ink);background:var(--surface-2);border-radius:8px;padding:8px 10px;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.row .snip i{display:block;font-style:normal;font-size:11.5px;color:var(--muted);letter-spacing:.03em;margin-bottom:2px}
.rfilters{display:grid;gap:8px;margin:14px 0 8px}
.rf-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rf-lab{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;min-width:112px}
.rf-row button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.rf-row button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:8px}
.rcard{display:grid;gap:5px;align-content:start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 15px;cursor:pointer;color:var(--ink);border-left:5px solid #C9933F;transition:transform .12s,box-shadow .12s}
.rcard:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,0,0,.06)}
.rcard b{font-size:15.5px;line-height:1.3}
.rc-m{font-size:11.5px;font-weight:600;color:#93641C;text-transform:uppercase;letter-spacing:.04em}
.rc-t{font-size:12.5px;color:var(--muted)}
.rc-b{display:flex;flex-wrap:wrap;gap:4px}.rc-b i{font-style:normal;font-size:11.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.rc-n{font-size:13px;color:var(--faint);font-weight:500}
.rtags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.rtags span{font-size:12.5px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:3px 11px}
.rtags span:first-child{background:#FCEFD9;color:#93641C;border-color:#F0D9B0;font-weight:600}
ol.steps{counter-reset:st;list-style:none;padding:0;display:grid;gap:10px}
ol.steps li{counter-increment:st;position:relative;padding-left:40px;line-height:1.55}
ol.steps li::before{content:counter(st);position:absolute;left:0;top:-1px;width:27px;height:27px;border-radius:50%;background:#FCEFD9;color:#93641C;font-weight:700;font-size:13px;display:grid;place-items:center}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rtags span:first-child,:root:not([data-theme="light"]) ol.steps li::before{background:#3A2E1C;color:#F0C987;border-color:#5A4628}:root:not([data-theme="light"]) .rc-m{color:#F0C987}}
:root[data-theme="dark"] .rtags span:first-child,:root[data-theme="dark"] ol.steps li::before{background:#3A2E1C;color:#F0C987;border-color:#5A4628}:root[data-theme="dark"] .rc-m{color:#F0C987}
@media (max-width:600px){.rf-lab{min-width:100%}.rgrid{grid-template-columns:1fr}}
.pmode .top,.pmode nav.side,.pmode .mnav{display:none}
.pmode .shell{grid-template-columns:minmax(0,1fr)}
.cons{max-width:820px;margin:24px auto 60px;background:#fff;color:#2b2b2b;border-radius:18px;padding:34px 40px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.cs-top{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.cs-head{background:#EAF3EC;border-radius:14px;padding:20px 24px;margin-bottom:18px}
.cs-k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#2F6B4E}
.cs-head h1{font-size:28px;margin:4px 0 10px;color:#24543D}
.cs-meta{display:flex;gap:28px;flex-wrap:wrap;font-size:13px;color:#555}
.cs{break-inside:avoid;margin:0 0 14px;padding:12px 18px;border-radius:12px;border:1px solid #E4E7E1}
.cs h2{font-size:15px;margin:0 0 6px;color:#2F6B4E}
.cs ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.55}.cs li{margin:2px 0}.cs p{margin:0;font-size:13.5px}
.cs.plus{background:#F3F8F4}.cs.moins{background:#FDF4EC;border-color:#F2DCC6}.cs.moins h2{color:#9A5A25}
.cs.alert{background:#FCEEF1;border-color:#F2CCD5}.cs.alert h2{color:#9E3D55}
.cs.blank .ln{border-bottom:1px dotted #B9C0B6;height:26px}
.cs-foot{font-size:11.5px;color:#666;margin-top:18px;line-height:1.5}
@media (max-width:600px){.cons{padding:20px 16px;margin:10px 0}}
@media print{#main,#view,main{padding:0!important;margin:0!important;min-height:0!important}.noprint{display:none!important}body{background:#fff}.cons{box-shadow:none;margin:0;padding:0;max-width:none}.shell{padding:0}@page{margin:14mm}.cs{-webkit-print-color-adjust:exact;print-color-adjust:exact}.cs-head{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.c-wrap{display:grid;gap:18px}
.c-head{display:flex;flex-wrap:wrap;gap:14px 20px;justify-content:space-between;align-items:flex-start;padding:24px 26px;border-radius:20px;background:var(--surface);box-shadow:var(--shadow)}
.c-k{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.c-head h1{margin:2px 0 6px;font-size:clamp(21px,2.6vw,27px);font-weight:600;line-height:1.2}
.c-priv{display:flex;gap:7px;align-items:center;margin:0;font-size:13px;color:var(--muted)}
.c-priv svg{flex:none;color:var(--accent)}
.c-tools{display:flex;flex-wrap:wrap;gap:8px}
.c-nav{display:grid;gap:10px}
.c-navg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.c-navg>span{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);min-width:130px}
.c-navg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.c-navg button:hover{border-color:var(--accent)}
.c-navg button[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.c-navg button i{font-style:normal;font-size:11px;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
.c-navg button[aria-current="true"] i{background:rgba(255,255,255,.25);color:inherit}
.c-step{display:grid;gap:14px}
.c-step>h2{margin:6px 0 0;font-size:20px;font-weight:600}
.c-sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:12px;min-width:0}
.c-sec h3{margin:0;font-size:15.5px;font-weight:600;color:var(--accent)}
.c-sh{display:flex;justify-content:space-between;gap:10px;align-items:center}
.c-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px}
.c-f{display:grid;gap:6px;align-content:start;min-width:0}
.c-f.full{grid-column:1/-1}
.c-l{font-size:13px;font-weight:500;color:var(--ink)}
.c-f input,.c-f textarea,.c-add input{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0}
.c-f textarea{resize:vertical;line-height:1.5;min-height:74px}
.c-f input:focus,.c-f textarea:focus,.c-add input:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:transparent}
.c-n{display:flex;gap:8px;align-items:center}.c-n input{max-width:140px}.c-n span{color:var(--muted);font-size:13px}
.c-ch{display:flex;flex-wrap:wrap;gap:6px}
.c-ch button{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;text-align:left}
.c-ch button:hover{border-color:var(--accent)}
.c-ch button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.c-ch button i{font-style:normal;font-size:10.5px;font-weight:700;opacity:.55}
.c-s{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted)}
.c-sb{display:flex;gap:3px;flex-wrap:wrap}
.c-sb button{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:13px;cursor:pointer;font-variant-numeric:tabular-nums}
.c-sb button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.c-info{font-size:13.5px;line-height:1.55;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 13px}

function hexToHsl(h){h=h.replace('#','');const r=parseInt(h.slice(0,2),16)/255,g=parseInt(h.slice(2,4),16)/255,b=parseInt(h.slice(4,6),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b);let H=0,S=0;const L=(mx+mn)/2;if(mx!==mn){const d=mx-mn;S=L>.5?d/(2-mx-mn):d/(mx+mn);H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;H*=60}return [H,S*100,L*100]}
function tint(col){const p=PAL[col]||PAL.autre;const [h,s]=hexToHsl(p[1]);return `--cb-l:${p[0]};--cf-l:${p[1]};--cb-d:hsl(${h} ${Math.min(s,40)}% 21%);--cf-d:hsl(${h} ${Math.min(s+10,60)}% 80%)`}

const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/œ/g,'oe').replace(/æ/g,'ae').replace(/[’']/g,"'");
const normH = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

const slug = s => norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60);
const STOP = new Set(['de','la','le','les','des','du','et','en','a','au','aux','un','une','d','l','pour','sur','avec','dans']);
function tokens(q){return norm(q).split(/[^a-z0-9]+/).filter(t=>t && !STOP.has(t))}

/* ---------------- état ---------------- */
let BASE = new Map();      // fiches d'origine
let OVR = new Map();       // modifications et ajouts (db)

function merge(){
  const m = new Map();
  for (const [id,e] of BASE) m.set(id,{...e});
  for (const [id,o] of OVR){
    if (o.deleted){ m.delete(id); continue }
    const b = BASE.get(id);
    m.set(id, b ? {...b,...o,edited:true} : {...o,mine:true});
  }
  ALL = [...m.values()];
  BYID = m;
  buildIndex();
}

function blockTexts(e){
  // segments (libellé de section, texte) pour la recherche et les extraits
  const segs = []; let ctx = '';
  for (const b of e.blocks||[]){
    const k=b[0];
    if (k==='h'){ctx=b[1];segs.push([ctx,b[1]])}
    else if (k==='p'||k==='note') segs.push([ctx,b[1]]);
    else if (k==='upd') segs.push(['Précision actuelle',b[1]]);
    else if (k==='ul'||k==='ol') for (const t of b[1]) segs.push([ctx,t]);
    else if (k==='tags') segs.push(['Étiquettes',b[1].join(' · ')]);
    else if (k==='sec') for (const t of b[3]) segs.push([b[1],t]);
    else if (k==='tb') for (const r of b[1]) segs.push([ctx,r.join(' · ')]);
  }
  return segs;
}
function buildIndex(){
  IDX = ALL.map(e=>{
    const segs = blockTexts(e);
    return {e, t:norm(e.t), meta:norm([e.grp,e.sub,(e.al||[]).join(' '),catLabel(e.cat)].join(' ')), al:(e.al||[]).map(norm),
            segs, segN:segs.map(s=>norm(s[1]))};
  });
}

/* ---------------- recherche ---------------- */
function search(q){
  const toks = tokens(q); const phrase = norm(q).trim();
  if (!toks.length) return {main:[],cited:[]};
  const main=[], cited=[];
  for (const x of IDX){
    let s=0;
    const inTitle = toks.every(t=>x.t.includes(t));
    const inMeta = toks.every(t=>x.t.includes(t)||x.meta.includes(t));
    if (x.t===phrase) s+=200;
    else if (x.t.startsWith(phrase)) s+=120;
    if (inTitle) s+=80 + (x.e.top?25:0);
    if (x.al.some(a=>a===phrase)) s+=90 + (x.e.top?40:0) + (x.al[0]===phrase?30:0);
    else if (inMeta) s+=40 + (x.e.top?20:0);
    // occurrences dans le texte
    let hits=0, first=-1, ph=false;
    for (let i=0;i<x.segN.length;i++){
      const n=x.segN[i];
      if (toks.every(t=>n.includes(t))){hits++; if(first<0)first=i; if(n.includes(phrase))ph=true}
    }
    if (inTitle||inMeta){ main.push({x,s:s+Math.min(hits,10)}) }
    else if (hits){ cited.push({x,s:hits*2+(ph?15:0),seg:first}) }
  }
  main.sort((a,b)=>b.s-a.s||a.x.e.t.localeCompare(b.x.e.t,'fr'));
  cited.sort((a,b)=>b.s-a.s||a.x.e.t.localeCompare(b.x.e.t,'fr'));
  for (const c of main){ // extrait si le texte contient aussi la requête
    const i=c.x.segN.findIndex(n=>toks.every(t=>n.includes(t))); c.seg=i;
  }
  return {main,cited,toks};
}
function hl(text,toks){
  let h=esc(text); if(!toks||!toks.length) return h;
  const nt=normH(text); const marks=[];
  for (const t of toks){let i=0;while((i=nt.indexOf(t,i))>=0){marks.push([i,i+t.length]);i+=t.length}}
  if(!marks.length) return h;
  marks.sort((a,b)=>a[0]-b[0]); const merged=[];
  for(const m of marks){const l=merged[merged.length-1];if(l&&m[0]<=l[1])l[1]=Math.max(l[1],m[1]);else merged.push([...m])}
  // norm() garde la même longueur que le texte d'origine pour les lettres latines courantes
  let out='',p=0;for(const [a,b] of merged){out+=esc(text.slice(p,a))+'<mark>'+esc(text.slice(a,b))+'</mark>';p=b}
  return out+esc(text.slice(p));
}
function snippet(text,toks){
  const nt=normH(text); let i=-1; for(const t of toks){const j=nt.indexOf(t);if(j>=0&&(i<0||j<i))i=j}
  if(i<0||text.length<=220) return hl(text.slice(0,220)+(text.length>220?'…':''),toks);
  const a=Math.max(0,i-80), b=Math.min(text.length,i+150);
  return (a>0?'…':'')+hl(text.slice(a,b),toks)+(b<text.length?'…':'');
}

}

/* ---------------- édition : texte <-> blocs ---------------- */
function toText(blocks){
  const L=[];
  for(const b of blocks||[]){
    const k=b[0];
    if(k==='h')L.push('## '+b[1]);
    else if(k==='p')L.push(b[1]);
    else if(k==='ul')b[1].forEach(t=>L.push('- '+t));
    else if(k==='ol')b[1].forEach((t,i)=>L.push((i+1)+'. '+t));
    else if(k==='tags')L.push('[étiquettes: '+b[1].join(' | ')+']');
    else if(k==='note')L.push('> '+b[1]);
    else if(k==='upd')L.push('>> '+b[1]);
    else if(k==='sec'){L.push('### '+(KINDMARK[b[2]]?'['+KINDMARK[b[2]]+'] ':'')+b[1]);b[3].forEach(t=>L.push('- '+t))}
    else if(k==='tb'){if(b[2])L.push('|| '+b[2].join(' | '));b[1].forEach(r=>L.push('| '+r.join(' | ')))}
    else if(k==='img')L.push('[image: '+b[1]+']');
    else if(k==='map')L.push('[schéma interactif: '+b[1]+']');
    else if(k==='links')L.push('@ '+b[1].join(', '));
    L.push('');
  }
  return L.join('\n').replace(/\n{3,}/g,'\n\n').trim();
}
function fromText(txt){
  const out=[]; let sec=null, ul=null, tb=null, ol=null;
  const close=()=>{sec=null;ul=null;tb=null;ol=null};
  for(const raw of txt.split('\n')){
    const l=raw.trim();
    if(!l){ if(ul) ul=null; if(tb) tb=null; continue }
    let m;
    if((m=l.match(/^###\s*(?:\[([^\]]+)\]\s*)?(.*)$/))){close();const kd=m[1]?(MARKKIND[norm(m[1]).trim()]||'normal'):(/signes d'alerte/i.test(m[2])?'alert':'normal');sec=['sec',m[2].trim(),kd,[]];out.push(sec);continue}
    if((m=l.match(/^##\s*(.*)$/))){close();out.push(['h',m[1].trim()]);continue}
    if((m=l.match(/^>>\s*(.*)$/))){close();out.push(['upd',m[1]]);continue}
    if((m=l.match(/^>\s*(.*)$/))){close();out.push(['note',m[1]]);continue}
    if((m=l.match(/^\|\|\s*(.*)$/))){sec=null;ul=null;tb=['tb',[],m[1].split('|').map(s=>s.trim())];out.push(tb);continue}
    if((m=l.match(/^\|\s*(.*)$/))){sec=null;ul=null;if(!tb){tb=['tb',[],null];out.push(tb)}tb[1].push(m[1].replace(/\|\s*$/,'').split('|').map(s=>s.trim()));continue}
    if((m=l.match(/^\[image:\s*(.*)\]$/))){close();out.push(['img',m[1].trim()]);continue}
    if((m=l.match(/^\[schéma interactif:\s*(.*)\]$/))){close();out.push(['map',m[1].trim()]);continue}
    if((m=l.match(/^\[étiquettes:\s*(.*)\]$/))){close();out.push(['tags',m[1].split('|').map(s=>s.trim()).filter(Boolean)]);continue}
    if(!sec&&(m=l.match(/^\d+[.)]\s+(.*)$/))){ul=null;tb=null;if(!ol){ol=['ol',[]];out.push(ol)} ol[1].push(m[1]);continue}
    if((m=l.match(/^@\s*(.*)$/))){close();out.push(['links',m[1].split(',').map(s=>s.trim()).filter(Boolean)]);continue}
    if((m=l.match(/^[-•*]\s+(.*)$/))){ if(sec){sec[3].push(m[1])} else {if(!ul){ul=['ul',[]];out.push(ul)} ul[1].push(m[1])} continue }
    if(sec){ sec[3].push(l); continue }
    ul=null; tb=null; out.push(['p',l]);
  }
  return out.filter(b=>!(b[0]==='sec'&&!b[3].length&&false));

  const terms=Object.keys(D.terms);
  const scan=(txt,step)=>{ const W=String(txt||'').split(/[^A-Za-zÀ-ÖØ-öø-ÿŒœÆæ0-9]+/).filter(Boolean); const n=' '+W.map(w=>cN(w).trim()).join(' ')+' '; if(n.length<4) return; const m=[];
    for(const t of terms){ let p=n.indexOf(' '+t); while(p>=0){ const e=p+1+t.length; const c=n.slice(e,e+2); if((c[0]===' '||((c[0]==='s'||c[0]==='x')&&c[1]===' '))&&!/ (pas d[e']?|pas d|sans|aucune?|jamais de|ni|non|zero|absence de) *$/.test(n.slice(Math.max(0,p-16),p+1))) m.push([p,e,t]); p=n.indexOf(' '+t,p+1) } }
    m.sort((a,b)=>(b[1]-b[0])-(a[1]-a[0])); const used=[];
    for(const [a,b,t] of m){ if(used.some(([x,y])=>a<y&&b>x)) continue; used.push([a,b]); const wi=(n.slice(0,a+1).match(/ /g)||[]).length-1; const disp=W.slice(wi,wi+t.split(' ').length).join(' ')||t; for(const id of D.terms[t]) hit(id,step,disp.toLowerCase()) } };
  CFL=CFL||cFieldList();
  for(const {f,st} of CFL){ const v=CONS.v[f.k]; if(v==null||v==='') continue;
    if(f.t==='s'){ for(const s of D.st) if(s.k===f.k&&((s.max!=null&&+v<=s.max)||(s.min!=null&&+v>=s.min))) for(const id of s.ids) hit(id,st.t,f.l+' : '+v+'/10'); continue }
    const vals=[].concat(v);
    const vt=D.vt[f.k]; if(vt) for(const x of vals) for(const id of (vt[x]||[])) hit(id,st.t,f.l+' : '+cLab(x));
    scan(vals.map(cLab).join(' · '),st.t);
  }
  CONS.tgt.forEach(i=>scan(CONS.v['tgt_'+i],'Questions ciblées'));
  for(const id of CONS.patho){ hit(id,'Questions ciblées','ajoutée'); scan(CONS.v['pat_'+id],'Questions ciblées') }
  scan(CONS.v[cKey('synthese','Causes profondes')],'Synthèse');
  for(const id of CONS.extra) hit(id,'Ajout manuel','ajoutée');
  for(const k of CONS.sel.keys()){ const id=k.split('§')[0]; if(id!=='free'&&!R.has(id)&&!CONS.hide.has(id)) hit(id,'Conseils retenus','conseil retenu') }
  return [...R.values()];
}
function cSelCount(id){ let n=0; for(const k of CONS.sel.keys()) if(k.startsWith(id+'§')) n++; return n }
function cItemBtn(id,si,ii,txt,warn){ const k=`${id}§${si}§${ii}`, on=CONS.sel.has(k);
  return `<li class="${warn?'w':''}"><button type="button" data-cadd="${esc(k)}" aria-pressed="${on}" title="${on?'Retirer de la liste':'Ajouter à la liste de conseils'}"><span class="ck">${on?'✓':'+'}</span><span>${esc(txt)}</span></button></li>` }
function cSubjCard(r){
  const s=cSubj(r.id); if(!s) return ''; const open=CONS.open.has(r.id); const n=cSelCount(r.id);
  const src=r.src.map(x=>`${esc(x.step)} · « ${esc(x.what)} »`).join(' ; ');
  const body=open?`<div class="ca-acts"><button type="button" class="btn sm" data-open="${esc(r.id)}">Ouvrir la fiche</button><button type="button" class="btn sm" data-chide="${esc(r.id)}">Ne pas retenir</button></div>
    ${s.g.length?s.g.map((g,si)=>`<div class="ca-g ${g.cat===CCATS[11]?'warn':''}"><div class="ca-gh"><h4>${esc(g.t)}</h4><button type="button" class="ca-all" data-call="${esc(r.id)}§${si}">Tout ajouter</button></div><ul>${g.items.map((t,ii)=>cItemBtn(r.id,si,ii,t,g.cat===CCATS[11])).join('')}</ul></div>`).join(''):'<p class="c-muted">Pas de conseils structurés sur cette fiche : ouvre-la pour la lire.</p>'}
    ${s.alert.length?`<div class="c-info alert"><b>Signes d'alerte</b><ul>${s.alert.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}`:'';
  return `<section class="ca-card${open?' open':''}"><button type="button" class="ca-h" data-ctog="${esc(r.id)}" aria-expanded="${open}"><span class="ca-t">${esc(s.t)}</span>${n?`<i>${n}</i>`:''}<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button><div class="ca-src">${src}</div>${body}</section>`;
}
let CASIG='';
function cAsideHtml(){
  const L=cDetect(); CASIG=L.map(r=>r.id+':'+r.src.length).join(',');
  const opts=ALL.filter(e=>e.cat==='pathologie'||e.cat==='population'||['Micronutrition','Sommeil','Gestion du stress'].includes(e.grp)).filter(e=>!e.top).map(e=>e.t).sort((a,b)=>a.localeCompare(b,'fr'));
  const w=[]; if(CONS.v.ttt) w.push("Traitement en cours renseigné : vérifie la rubrique « Interactions et contre-indications » de chaque fiche et la fiche de chaque plante avant de la proposer.");
  if(/enceinte|grossesse en cours|allait/.test(cN(Object.values(CONS.v).join(' ')))) w.push("Grossesse ou allaitement mentionné : la plupart des huiles essentielles, de nombreuses plantes et le jeûne sont exclus.");
  return `<div class="ca-head"><div><h3>Conseils du référentiel</h3><p>Fiches repérées dans tes notes, par mots-clés : vérifie leur pertinence avant de retenir un conseil.</p></div>
   <button type="button" class="btn primary sm" data-cstep="conseils">Ma liste · ${CONS.sel.size}</button><button type="button" class="ca-x" data-cfab aria-label="Fermer">✕</button></div>
   ${w.map(x=>`<div class="c-info warn">${esc(x)}</div>`).join('')}
   <div class="c-add"><input id="caIn" list="caList" placeholder="Ajouter une fiche (pathologie, carence…)" autocomplete="off"><datalist id="caList">${opts.map(t=>`<option value="${esc(t)}">`).join('')}</datalist><button type="button" class="btn sm" data-cxadd>Ajouter</button></div>
   ${L.length?L.map(cSubjCard).join(''):`<div class="ca-empty">Au fil de la consultation, les pathologies, symptômes et carences que tu notes (par exemple « endométriose », « baisse de moral », « carence en fer ») font apparaître ici les conseils du référentiel.</div>`}
   ${CONS.hide.size?`<button type="button" class="ca-all" data-cunhide>Réafficher les ${CONS.hide.size} fiche${CONS.hide.size>1?'s':''} écartée${CONS.hide.size>1?'s':''}</button>`:''}`;
}
function cAsideRefresh(force){
  const a=document.getElementById('cAside'); if(!a) return;
  const sig=cDetect().map(r=>r.id+':'+r.src.length).join(',');
  if(force||sig!==CASIG){ const st=a.scrollTop; a.innerHTML=cAsideHtml(); a.scrollTop=st }
  cFabRefresh();
}
function cFabRefresh(){ const b=document.querySelector('.c-fab'); if(!b) return; const n=cDetect().length; b.innerHTML=`Conseils · ${n} fiche${n>1?'s':''}${CONS.sel.size?` · ${CONS.sel.size} retenu${CONS.sel.size>1?'s':''}`:''}`; b.hidden=false }
let CAT=null; const cAsideSoon=()=>{ clearTimeout(CAT); CAT=setTimeout(()=>cAsideRefresh(false),350) };
/* étape « Conseils retenus » */
function cGrouped(){ const G={}; for(const [k,o] of CONS.sel) (G[o.cat]=G[o.cat]||[]).push([k,o]); return CCATS.filter(c=>G[c]).map(c=>[c,G[c]]) }
function cAdviceStep(){
  const G=cGrouped();
  return `<section class="c-sec"><p class="c-muted">Les conseils que tu as ajoutés depuis le panneau « Conseils du référentiel » sont rangés ici par thème. Tu peux reformuler chaque conseil pour la personne, en retirer ou en ajouter. La fiche conseils PDF reprend cette liste, les priorités de la synthèse et les signes d'alerte des fiches concernées.</p>
   <div class="c-acts"><button type="button" class="btn primary" data-cprint="conseils">Télécharger la fiche conseils (PDF)</button><button type="button" class="btn" data-cfab>Voir les conseils du référentiel</button></div></section>
   ${G.length?G.map(([c,L])=>`<section class="c-sec"><h3>${esc(c)}</h3>${L.map(([k,o])=>`<div class="cr-it"><textarea data-cedit="${esc(k)}" rows="2">${esc(o.txt)}</textarea><div class="cr-m"><span>${o.id==='free'?'Ajout libre':esc((BYID.get(o.id)||{}).t||'')}</span><button type="button" class="btn sm" data-cdel="${esc(k)}">Retirer</button></div></div>`).join('')}</section>`).join(''):'<div class="ca-empty">Aucun conseil retenu pour l\'instant. Ouvre une fiche dans le panneau « Conseils du référentiel » et touche le « + » devant un conseil pour l\'ajouter.</div>'}
   <section class="c-sec"><h3>Ajouter un conseil libre</h3><div class="c-grid"><div class="c-f"><span class="c-l">Thème</span><select id="cfCat">${CCATS.map(c=>`<option>${esc(c)}</option>`).join('')}</select></div><div class="c-f full"><label class="c-l" for="cfTxt">Conseil</label><textarea id="cfTxt" rows="2"></textarea></div></div><div><button type="button" class="btn" data-cfree>Ajouter à la liste</button></div></section>`;
}
function cAlertsSel(){ const ids=[...new Set([...CONS.sel.values()].map(o=>o.id).filter(i=>i!=='free'))]; const A=[]; for(const id of ids){ const s=cSubj(id); if(s) for(const a of s.alert) if(!A.includes(a)) A.push(a) } return [ids,A] }
function cClientSheet(){
  const v=CONS.v, who=[v.prenom,v.nom].filter(Boolean).join(' '); const [ids,A]=cAlertsSel();
  const prio=v.prio||''; const rdv=v[cKey('synthese','Prochain rendez-vous')]||'';
  const G=cGrouped();
  return `<header class="r-head"><div class="r-k">Fiche conseils naturopathiques</div><h1>${esc(who||'Mes conseils')}</h1><div class="r-meta">${v.date_rdv?`<span>Consultation du ${esc(cVal({k:'date_rdv',t:'d'}))}</span>`:''}${ids.length?`<span>${ids.map(i=>esc((BYID.get(i)||{}).t||'')).join(' · ')}</span>`:''}</div></header>
   ${prio?`<section class="r-step"><h2>Mes priorités pour les prochaines semaines</h2><p>${esc(prio)}</p></section>`:''}
   ${G.map(([c,L])=>`<section class="r-step"><h2>${esc(c==='Précautions'?'Précautions à respecter':c)}</h2><ul>${L.map(([k,o])=>`<li>${esc(o.txt)}</li>`).join('')}</ul></section>`).join('')}
   ${A.length?`<section class="r-step r-al"><h2>Consulter sans attendre si</h2><ul>${A.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></section>`:''}
   ${rdv?`<section class="r-step"><h2>Prochain rendez-vous</h2><p>${esc(rdv)}</p></section>`:''}
   <p class="r-foot">Ces conseils d'hygiène de vie accompagnent le suivi médical et ne le remplacent pas. Ne jamais arrêter ni modifier un traitement sans l'avis du médecin. Avant de prendre une plante, une huile essentielle ou un complément, signaler tout traitement en cours, une grossesse ou un allaitement.</p>`;
}
function cAdviceReport(){ const G=cGrouped(); if(!G.length) return ''; return G.map(([c,L])=>`<div class="r-sec"><h3>${esc(c)}</h3><ul>${L.map(([k,o])=>`<li>${esc(o.txt)}</li>`).join('')}</ul></div>`).join('') }
function vConsult(){
  setTimeout(cFabRefresh,0);
  return `<div class="c-layout${CONS.drawer?' drawer':''}"><div class="c-main">${vConsultMain()}</div><aside id="cAside" class="c-aside" aria-label="Conseils du référentiel">${cAsideHtml()}</aside></div><button type="button" class="c-fab" data-cfab hidden></button>`;
}
document.addEventListener('input',ev=>{ if(view.name!=='consult') return; const t=ev.target;
  if(t.dataset&&t.dataset.cedit){ const o=CONS.sel.get(t.dataset.cedit); if(o) o.txt=t.value; return }
  if(t.closest&&t.closest('.c-main')) cAsideSoon() });
document.addEventListener('click',ev=>{
  if(view.name!=='consult') return; const t=ev.target.closest('button'); if(!t) return; const d=t.dataset;
  if(t.closest('.c-main')&&(d.cc||d.cs||d.ctg!==undefined||'cpadd' in d||d.cprm)) { cAsideSoon(); return }
  if(d.ctog){ const id=d.ctog; CONS.open.has(id)?CONS.open.delete(id):CONS.open.add(id); cAsideRefresh(true); return }
  if(d.cadd){ const [id,si,ii]=d.cadd.split('§'); const s=cSubj(id); if(!s) return; const g=s.g[+si];
    if(CONS.sel.has(d.cadd)) CONS.sel.delete(d.cadd); else CONS.sel.set(d.cadd,{id,cat:g.cat,txt:g.items[+ii]});
    const on=CONS.sel.has(d.cadd); t.setAttribute('aria-pressed',on); t.querySelector('.ck').textContent=on?'✓':'+'; cAsideHead(); cRefreshNav(); return }
  if(d.call){ const [id,si]=d.call.split('§'); const s=cSubj(id), g=s&&s.g[+si]; if(!g) return; const all=g.items.every((x,ii)=>CONS.sel.has(`${id}§${si}§${ii}`));
    g.items.forEach((x,ii)=>{const k=`${id}§${si}§${ii}`; if(all) CONS.sel.delete(k); else if(!CONS.sel.has(k)) CONS.sel.set(k,{id,cat:g.cat,txt:x})}); cAsideRefresh(true); cRefreshNav(); return }
  if(d.chide){ CONS.hide.add(d.chide); CONS.extra=CONS.extra.filter(x=>x!==d.chide); cAsideRefresh(true); return }
  if('cunhide' in d){ CONS.hide.clear(); cAsideRefresh(true); return }
  if('cxadd' in d){ const q=cN($('#caIn').value); const e=ALL.find(x=>cN(x.t)===q)||(q.length>4&&ALL.find(x=>(x.cat==='pathologie'||x.grp==='Micronutrition')&&cN(x.t).includes(q)));
    if(!e){ toast('Fiche introuvable : choisis-la dans la liste'); return } CONS.hide.delete(e.id); if(!CONS.extra.includes(e.id)) CONS.extra.push(e.id); CONS.open.add(e.id); cAsideRefresh(true); return }
  if('cfab' in d){ CONS.drawer=!CONS.drawer; const l=document.querySelector('.c-layout'); if(l) l.classList.toggle('drawer',CONS.drawer); document.body.classList.toggle('cdrawer',CONS.drawer); return }
  if(d.cdel){ CONS.sel.delete(d.cdel); render(); return }
  if('cfree' in d){ const x=($('#cfTxt').value||'').trim(); if(!x){ toast('Écris le conseil à ajouter'); return } CONS.sel.set('free§'+(++CONS.nfree),{id:'free',cat:$('#cfCat').value,txt:x}); render(); return }
});
document.addEventListener('keydown',ev=>{ if(ev.key==='Enter'&&ev.target.id==='caIn'){ ev.preventDefault(); const b=document.querySelector('[data-cxadd]'); if(b) b.click() } });
function cAsideHead(){ const b=document.querySelector('.ca-head [data-cstep="conseils"]'); if(b) b.textContent='Ma liste · '+CONS.sel.size;
  document.querySelectorAll('.ca-card').forEach(c=>{const id=c.querySelector('[data-ctog]').dataset.ctog; const n=cSelCount(id); let i=c.querySelector('.ca-h i'); if(n){ if(!i){ i=document.createElement('i'); c.querySelector('.ca-t').after(i) } i.textContent=n } else if(i) i.remove()}); cFabRefresh() }
document.addEventListener('click',ev=>{ if(CONS.drawer&&ev.target===document.body){ CONS.drawer=false; document.body.classList.remove('cdrawer'); const l=document.querySelector('.c-layout'); if(l) l.classList.remove('drawer') } });

})();
</script>

</html>
